[project]
name = "mmgraph-agent"
version = "0.1.0"
description = "Independent reproduction of MMGraph-Agent: zero-API multimodal hypergraph, cache-inspired L1/L2 memory, and a GRPO retrieval-and-answer policy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "MMGraph-Med Authors" }]
keywords = ["multimodal-rag", "knowledge-graph", "hypergraph", "grpo", "reproduction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
nlp = ["spacy>=3.7"]
gpu = ["torch>=2.1", "transformers>=4.40", "faiss-cpu>=1.7", "accelerate>=0.30"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0"]

[project.scripts]
mmgraph-build = "mmgraph_agent.cli:build"
mmgraph-smoke = "mmgraph_agent.cli:smoke"
mmgraph-evaluate = "mmgraph_agent.cli:evaluate"
mmgraph-viz = "mmgraph_agent.cli:viz"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
