<text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#1F2937">MMGraph-Med: a four-paper fusion pipeline</text>
<text x="40" y="108" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="normal" fill="#4B5563">Construction (M3KG-RAG)  ->  Hypergraph + Memory (MMGraph-Agent)  ->  multi-hop retrieval  ->  policy (heuristic / GRPO reward)</text>
<rect x="40" y="150" width="320" height="90" rx="14" fill="#E8F1FB" stroke="#4A90D9" stroke-width="3"/>
<text x="102.0" y="190.0" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#1F2937">Clinical documents</text>
