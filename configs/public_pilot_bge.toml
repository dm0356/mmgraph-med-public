[project]
name = "mmgraph-med-public-pilot-bge"

# Public ECG pilot with the local BGE-M3 embedding service (no LLM extraction).
[hypergraph]
parser = "regex"
embedder = "api"
embed_dim = 1024
max_entities_per_unit = 12
modalities = ["text", "table", "diagram"]

[embedding]
base_url = "http://127.0.0.1:18000/v1/embeddings"
model = "bge-m3"
api_key_env = "MMGRAPH_EMBED_API_KEY"
dim = 1024
timeout = 120

[extractor]
mode = "regex"
language = "zh"

[captioner]
enabled = false

[construction]
enabled = false

[grounding]
searcher = "none"

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false
hops = 1

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["public_pilot"]
metric = "token_f1"
