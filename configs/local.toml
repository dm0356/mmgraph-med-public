# Local deployment profile: every model runs on the cluster, no external API.
#
#   text extraction   : Qwen2.5-7B-Instruct   served by vLLM  :18000
#   image captioning  : Qwen2.5-VL-7B-Instruct served by vLLM :18001
#   text embeddings   : BGE-M3 (or bge-large-zh) served by vLLM :18002
#
# Ports 18000-18002 are used to avoid collisions on shared workstations
# (port 8000 is often already taken by another service).

[project]
name = "mmgraph-agent-local"

[hypergraph]
parser = "regex"           # local extractor supplies entities; regex is a fallback
embedder = "api"           # OpenAI-compatible /v1/embeddings on the cluster
embed_dim = 1024
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

[embedding]
base_url = "http://127.0.0.1:18002/v1/embeddings"
model = "BAAI/bge-m3"
api_key_env = "MMGRAPH_EMBED_API_KEY"   # vLLM usually ignores this
dim = 1024
timeout = 60

[extractor]
mode = "llm"
language = "zh"
base_url = "http://127.0.0.1:18000/v1/chat/completions"
model = "Qwen/Qwen2.5-7B-Instruct"
api_key_env = "LOCAL_LLM_KEY"
temperature = 0.0
timeout = 120
max_retries = 2
cache_dir = "out/.extract_cache"

[captioner]
enabled = true
provider = "local"
model = "Qwen/Qwen2.5-VL-7B-Instruct"
base_url = "http://127.0.0.1:18001/v1/chat/completions"
api_key_env = "LOCAL_VLM_KEY"
timeout = 180
temperature = 0.0
prompt = "请用一句中文描述这张医学图像的关键内容。"

# M3KG-style construction stages, all served by the local Qwen model.
[construction]
enabled = true
rewriter = true
grounding = true
refinement = true
inspector = false

# Patient data stays local: use a local medical glossary, not Wikipedia.
[grounding]
searcher = "local"
local_path = "data/glossary/medical_terms.sample.tsv"   # replace with your hospital glossary
max_candidates = 1

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
