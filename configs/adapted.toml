# Adapted reproduction profile (Chinese / clinical multimodal).
#
# Construction is API-assisted:
#   - text entity/relation extraction : DeepSeek (OpenAI-compatible)
#   - image decoding                  : Qwen-VL (DashScope compatible mode)
# The memory (§3.2) and GRPO policy (§3.3) are reproduced faithfully from the
# paper and do not depend on how the graph was built.
#
# API keys come from environment variables and must never be committed:
#   DEEPSEEK_API_KEY   (text extraction)
#   DASHSCOPE_API_KEY  (image captioning)

[project]
name = "mmgraph-agent-adapted"

[hypergraph]
parser = "regex"           # LLM extractor supplies entities; regex is only a fallback
embedder = "auto"          # on the cluster set to "clip" (Chinese-CLIP / BiomedCLIP)
embed_dim = 256
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

[extractor]
mode = "llm"
language = "zh"
base_url = "https://api.deepseek.com/v1/chat/completions"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
temperature = 0.0
timeout = 60
max_retries = 2
cache_dir = "out/.extract_cache"

[captioner]
enabled = true
provider = "qwen"
model = "qwen3-vl-plus"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
api_key_env = "DASHSCOPE_API_KEY"
timeout = 120
temperature = 0.0
prompt = "请用一句中文描述这张医学图像的关键内容。"

# M3KG-style construction stages (rewriter -> grounding -> refinement).
# Set enabled = false to skip them (fewer LLM calls).
[construction]
enabled = true
rewriter = true
grounding = true
refinement = true
inspector = false

# External grounding: only entity names are looked up on Wikipedia.
[grounding]
searcher = "wikipedia"
lang = "zh"
timeout = 10
max_candidates = 1
max_chars = 200

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
