# Default configuration for MMGraph-Med (a four-paper fusion reproduction).

[project]
name = "mmgraph-agent"

[hypergraph]
parser = "auto"            # auto | spacy | regex
embedder = "auto"          # auto | hashing | clip | api
embed_dim = 256
clip_model = "openai/clip-vit-base-patch32"   # or OFA-Sys/chinese-clip-vit-base-patch16
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

# Optional embedding endpoint (OpenAI-compatible /v1/embeddings), e.g. vLLM
# serving BAAI/bge-m3 on the cluster. Used when [hypergraph].embedder = "api".
[embedding]
base_url = ""              # e.g. http://127.0.0.1:8002/v1/embeddings
model = "BAAI/bge-m3"
api_key_env = "MMGRAPH_EMBED_API_KEY"
dim = 1024
timeout = 60

# Optional multimodal decoding through a Qwen-VL / DeepSeek-VL (OpenAI
# compatible) vision endpoint. Uses its OWN key env var so the text extractor
# and the vision model can have two different API keys.
[captioner]
enabled = false
provider = "qwen"          # qwen | deepseek | custom
model = "qwen3-vl-plus"    # qwen3-vl-plus / qwen3-vl-max / qwen-vl-max-latest
base_url = ""              # Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
api_key_env = "DASHSCOPE_API_KEY"
timeout = 120
temperature = 0.0
prompt = "请用一句中文描述这张医学图像的关键内容。"

# Optional LLM entity / relation extraction. "auto" uses the API only when
# base_url is set; "regex" forces the zero-API local extractor.
# For Chinese clinical text the LLM path is strongly recommended.
[extractor]
mode = "auto"              # auto | regex | llm
language = "zh"
base_url = ""              # DeepSeek: https://api.deepseek.com/v1/chat/completions
                           # Qwen   : https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
model = "deepseek-chat"    # or qwen-plus / qwen-max
api_key_env = "DEEPSEEK_API_KEY"
temperature = 0.0
timeout = 60
max_retries = 2
cache_dir = "out/.extract_cache"

[memory]
C = 5                      # per-bank retrieval budget shared by L1 and L2
L_max = 1200               # evidence truncation, in words
L_dig = 300                # digest length, in words
L_cap = 5000               # prompt token cap per trajectory

[retrieval]
top_k = 5
distance_threshold = 0.05  # cosine similarity floor (higher = stricter)
enable_web = false
hops = 0                   # multi-hop expansion through shared entities (0 = off)
cross_modal = false        # CLIP text -> image retrieval fused into memory

# M3KG-RAG-style construction stages (rewriter -> grounding -> refinement -> inspector).
# Disabled by default; enable together with the LLM extractor.
[construction]
enabled = false
rewriter = true            # context-enriched caption rewriting
grounding = true           # canonical entity names + encyclopaedic descriptions
refinement = true          # context-aware description selection/rewrite
inspector = false          # self-reflection scoring (extra LLM calls)

# External knowledge grounding (the "searcher" stage). Candidates are merged with
# LLM descriptions and passed to the refinement stage.
[grounding]
searcher = "none"          # none | local | wikipedia | icd10
local_path = "data/glossary/medical_terms.sample.tsv"
icd10_path = "data/icd10/diseases.json"   # download with scripts/fetch_icd10.sh
lang = "zh"                # Wikipedia language
timeout = 10
max_candidates = 3
max_chars = 200

[policy]
max_rounds = 5
regulator_base = 0.5       # concave bonus decay for extra retrieval calls
structural_penalty = 0.5   # penalty for malformed / retrieval-free trajectories
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"

# Pixel-level image encoding (separate from the text embedder).
# Captions stay in the text space for existing retrieval; CLIP vectors are
# stored alongside for true image-to-image / cross-modal use.
[image]
embedder = "none"          # none | clip
model = "openai/clip-vit-base-patch32"
dim = 512
device = "cpu"             # cpu | cuda:0 ...

