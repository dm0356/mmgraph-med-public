# Cluster profile for the L40S x8 setup.
#
# Default = faithful zero-API reproduction:
#   parser=spacy + embedder=clip + [extractor].mode=regex + [captioner].enabled=false
#
# For the Chinese/clinical API-adapted mode, switch [extractor]/[captioner]
# to the commented blocks below.

[project]
name = "mmgraph-agent-cluster"

[hypergraph]
parser = "spacy"           # local spaCy NER (zero-API)
embedder = "clip"          # frozen CLIP (zero-API)
embed_dim = 512
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

[extractor]
# zero-API faithful path: spaCy NER via parser=spacy, no paid API calls
mode = "regex"
language = "zh"
base_url = ""
model = ""
api_key_env = "DEEPSEEK_API_KEY"
cache_dir = "out/.extract_cache"
# --- API-adapted path (uncomment to use DeepSeek) ---
# mode = "llm"
# base_url = "https://api.deepseek.com/v1/chat/completions"
# model = "deepseek-chat"

[captioner]
# zero-API faithful path: images are encoded by CLIP, not captioned by an API
enabled = false
provider = "qwen"
model = "qwen3-vl-plus"
base_url = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout = 120
temperature = 0.0
prompt = "请用一句中文描述这张医学图像的关键内容。"
# --- API-adapted path (uncomment to use Qwen-VL) ---
# enabled = true
# base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
