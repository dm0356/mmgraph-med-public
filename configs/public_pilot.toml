[project]
name = "mmgraph-med-public-pilot"

# Fast zero-API profile for the public ECG pilot (no LLM calls).
[hypergraph]
parser = "regex"
embedder = "hashing"
embed_dim = 256
max_entities_per_unit = 12
modalities = ["text", "table", "diagram"]

[extractor]
mode = "regex"
language = "zh"

[captioner]
enabled = false

[construction]
enabled = false

[grounding]
searcher = "none"

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false
hops = 1

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["public_pilot"]
metric = "token_f1"
