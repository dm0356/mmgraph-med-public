# Smoke configuration: deterministic, CPU-only, no model downloads.

[project]
name = "mmgraph-agent-smoke"

[hypergraph]
parser = "regex"           # deterministic fallback; switch to "spacy" on a real run
embedder = "hashing"       # deterministic fallback; switch to "clip" on a GPU run
embed_dim = 256
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.0
enable_web = false

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
