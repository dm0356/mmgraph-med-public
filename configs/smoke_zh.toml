# Chinese smoke configuration: deterministic, CPU-only.

[project]
name = "mmgraph-agent-smoke-zh"

[hypergraph]
parser = "regex"           # Chinese demo uses the seed-lexicon fallback
embedder = "hashing"
embed_dim = 256
max_entities_per_unit = 12
modalities = ["text", "image", "table", "diagram"]

[captioner]
enabled = false

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.0
enable_web = false

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
