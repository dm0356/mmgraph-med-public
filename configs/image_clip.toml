[project]
name = "mmgraph-med-image-clip-demo"

# CPU/GPU demo: hashing text embeddings + frozen CLIP image embeddings.
[hypergraph]
parser = "regex"
embedder = "hashing"
embed_dim = 256
max_entities_per_unit = 12
modalities = ["text", "table", "diagram"]

[image]
embedder = "clip"
model = "openai/clip-vit-base-patch32"
dim = 512
device = "cpu"

[extractor]
mode = "regex"
language = "zh"

[captioner]
enabled = false

[construction]
enabled = false

[grounding]
searcher = "none"

[memory]
C = 5
L_max = 1200
L_dig = 300
L_cap = 5000

[retrieval]
top_k = 5
distance_threshold = 0.05
enable_web = false
hops = 1
cross_modal = true

[policy]
max_rounds = 5
regulator_base = 0.5
structural_penalty = 0.5
well_formed_required = true

[eval]
datasets = ["smoke"]
metric = "token_f1"
